name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Vet
        run: make vet
