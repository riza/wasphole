name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          SHORT_COMMIT="${COMMIT:0:7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BINARY="wasphole-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${SHORT_COMMIT} -X main.tag=${VERSION} -X main.buildDate=${DATE}" \
            -o "${BINARY}" \
            ./cmd/wasphole

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasphole-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wasphole-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  publish:
    name: Publish Release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
